name: 新建上游指定分支
# 更新到上游指定分支
# 切换到你仓库顶部的 Actions 选项卡。
# 点击左侧的 Fetch Specific Tag from Puock Upstream。
# 点击右侧的 Run workflow 按钮启动。
# 执行成功后，你的 Fork 仓库里就会自动多出一个名为 branch-v2.12.0 等的新分支，里面的代码与官方的 v2.12.0 等版本完全一致。
on:
  workflow_dispatch: # 允许你在网页上点击按钮手动触发

jobs:
  fetch-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Push Tag from Upstream
        run: |
          # 1. 配置 Git 身份标识
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. 动态添加原作者 Licoy 的仓库并抓取所有标签
          git remote add upstream https://github.com/Licoy/wordpress-theme-puock/
          git fetch upstream --tags
          
          # 3. 基于原作者的 v2.12.0 标签，创建属于你自己的专属分支
          git checkout -b branch-v2.12.0 upstream/tags/v2.12.0
          
          # 4. 将该新分支强行推送到你自己的 Fork 仓库中
          git push origin branch-v2.12.0 --force
